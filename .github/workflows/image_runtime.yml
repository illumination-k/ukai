name: Image Runtime

# Publishes images/runtime (ukai-gateway, ukai-knowledge, and the ukai-relay
# agent pods copy out of it) to ghcr.io for every change on main that reaches
# any of them.
on:
  push:
    branches: [main]
    paths:
      - "crates/ukai-acp/**"
      - "crates/ukai-config/**"
      - "crates/ukai-core/**"
      - "crates/ukai-gateway/**"
      - "crates/ukai-knowledge/**"
      - "crates/ukai-proto/**"
      - "crates/ukai-relay/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "images/runtime/**"
      - ".github/workflows/image_runtime.yml"
  workflow_dispatch:

# A newer main supersedes a build still running.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` for overlays that follow main, the commit for ones that pin.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ukai-runtime:latest
            ghcr.io/${{ github.repository_owner }}/ukai-runtime:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
