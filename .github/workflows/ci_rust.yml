name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/ukai-app/assets/**"
      - "crates/ukai-app/Dioxus.toml"
      - "ukai.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "mise.toml"
      - ".github/workflows/ci_rust.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/ukai-app/assets/**"
      - "crates/ukai-app/Dioxus.toml"
      - "ukai.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "mise.toml"
      - ".github/workflows/ci_rust.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      # System libraries the Dioxus desktop renderer links against on Linux,
      # declared in mise.toml's [bootstrap.packages]. `--update` because the
      # runner image ships stale apt lists, and mise only refreshes empty ones.
      - name: Install webview dependencies
        run: mise bootstrap packages apply --yes --update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --workspace --all-features

      - name: Lint
        run: mise run lint:rust

      - name: Test
        run: |
          mise run test:rust
          mise run test:rust:doc
