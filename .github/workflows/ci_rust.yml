name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/ukai-app/assets/**"
      - "crates/ukai-app/Dioxus.toml"
      - "ukai.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "mise.toml"
      - ".github/workflows/ci_rust.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/ukai-app/assets/**"
      - "crates/ukai-app/Dioxus.toml"
      - "ukai.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "mise.toml"
      - ".github/workflows/ci_rust.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Line tables keep backtraces readable at a fraction of the size, so
      # target/ (and the cache of it) stays small.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # System libraries the Dioxus desktop renderer links against on Linux,
      # declared in mise.toml's [bootstrap.packages]. `--update` because the
      # runner image ships stale apt lists, and mise only refreshes empty ones.
      - name: Install webview dependencies
        run: mise bootstrap packages apply --yes --update

      # Saved from main only: a PR restores main's cache, and per-branch
      # copies of target/ would push main's out of the 10 GB repository
      # limit. Saved after a failed run too, so a red main still warms it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # No separate `cargo build`: clippy --all-targets checks every target,
      # and nextest builds what the tests run.

      - name: Lint
        run: mise run lint:rust

      - name: Test
        run: |
          mise run test:rust
          mise run test:rust:doc
