name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/ukai-app/assets/**"
      - "crates/ukai-app/Dioxus.toml"
      - "ukai.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "mise.toml"
      - ".github/workflows/ci_rust.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/ukai-app/assets/**"
      - "crates/ukai-app/Dioxus.toml"
      - "ukai.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "mise.toml"
      - ".github/workflows/ci_rust.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # System libraries the Dioxus desktop renderer (wry/tao) links against on
      # Linux, and ALSA for the microphone (cpal). whisper.cpp builds with the
      # runner's cmake and clang.
      - name: Install webview and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev librsvg2-dev libssl-dev libasound2-dev

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --locked --workspace --all-features

      - name: Lint
        run: mise run lint:rust

      - name: Test
        run: |
          mise run test:rust
          mise run test:rust:doc
