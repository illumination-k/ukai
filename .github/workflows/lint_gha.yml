name: Lint GHA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "mise.toml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "mise.toml"

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: lint with mise
        run: mise run lint:gha
