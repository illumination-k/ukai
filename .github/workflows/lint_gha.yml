name: Lint GHA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "mise.toml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "mise.toml"

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: lint with mise
        run: mise run lint:gha
