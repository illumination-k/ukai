name: Lint GHA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "mise.toml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "mise.toml"

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: lint with mise
        run: mise run lint:gha
