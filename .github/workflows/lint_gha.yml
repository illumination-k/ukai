name: Lint GHA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "mise.toml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "mise.toml"

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the tools this job runs: the full set builds cargo-audit from
      # source. `mise run` would install the rest without the job's env,
      # and a prefix of its own keeps this partial set out of other jobs' cache.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache_key_prefix: mise-v1-lint-gha
          install_args: actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/ghalint aqua:suzuki-shunsuke/pinact

      - name: lint with mise
        run: mise run lint:gha
