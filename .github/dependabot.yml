version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # The dioxus crates and the `dx` CLI pin in mise.toml must move together.
      dioxus:
        patterns:
          - "dioxus*"
      # The ACP SDK and its HTTP transport are released in lockstep.
      acp:
        patterns:
          - "agent-client-protocol*"
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
