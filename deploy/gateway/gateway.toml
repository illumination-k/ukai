# The agents ukai-gateway serves at /agents/<id>/acp. A client declares one as
#
#   [agents.claude]
#   transport = "websocket"
#   url = "ws://localhost:8080/agents/claude/acp"
#
# Secrets are referenced as `<secret>/<key>` and never written here.

[agents.claude]
image = "registry.example.com/agent:latest"
command = "claude-agent-acp"
workspace = { git = "https://github.com/org/repo.git" }
# GitHub credentials for the workspace: installation tokens of the gateway's
# GitHub App (UKAI_GITHUB_APP_* in gateway.yaml), limited to this repository
# and these permissions (default: contents and pull_requests, write), or a
# long-lived token from a Secret instead (`github_token = "<secret>/<key>"`).
# workspace = { git = "https://github.com/org/repo.git", github_app = true, github_permissions = { contents = "write", pull_requests = "write" } }
# Agents naming the same project share its knowledge, whatever repository
# each works on; without it, an agent's knowledge is its repository's.
# knowledge = "my-project"
# A secretary reads the other workspaces' sessions and prompts them, starting
# a workspace if need be; it never answers their permission requests.
# secretary = true
# The checkout's reports, set here rather than in a ukai.toml in the
# repository: directories added to `[reports] dirs` (relative to its root,
# separated by `:`), globs replacing `[reports] globs` (likewise), and
# whether reports may load from the network.
# env = { UKAI_REPORT_DIRS = "reports", UKAI_REPORT_GLOBS = "**/*.html:**/*.png", UKAI_REPORT_ALLOW_NETWORK = "false" }
# Values may refer to `$(POD_NAMESPACE)`, which the gateway sets.
# env = { CACHE_URL = "http://cache.example.svc/$(POD_NAMESPACE)" }
# Labels of the pod, on top of the gateway's, e.g. one a webhook acts on.
# labels = { "example.com/inject" = "" }
# Tokens of the pod's ServiceAccount for an audience, kept fresh as a file,
# e.g. the subject token of a workload identity federation.
# tokens = [{ audience = "https://idp.example/wif/123", path = "/var/run/secrets/idp/token" }]
# The memory limit is the request unless `memory_limit` is set.
# resources = { cpu = "4", memory = "8Gi", memory_limit = "16Gi" }
