# ukai-gateway in one namespace, with only namespaced RBAC: it creates a Job
# per workspace for the agents in its gateway.toml and relays ACP to them.
# Apply with `kubectl apply -k deploy/gateway` (see kustomization.yaml), then
# reach it with `kubectl port-forward deploy/ukai-gateway 8080` or a Service.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ukai-gateway
  labels:
    app.kubernetes.io/name: ukai-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ukai-gateway
  labels:
    app.kubernetes.io/name: ukai-gateway
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # A schedule's command runs in its workspace's agent container.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # Each schedule and its recent runs are kept in a ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ukai-gateway
  labels:
    app.kubernetes.io/name: ukai-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ukai-gateway
subjects:
  - kind: ServiceAccount
    name: ukai-gateway
---
# One replica, replaced rather than rolled, so an update never needs quota for
# a second gateway pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ukai-gateway
  labels:
    app.kubernetes.io/name: ukai-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ukai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ukai-gateway
    spec:
      serviceAccountName: ukai-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ukai-runtime
          env:
            - name: UKAI_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ukai-gateway
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/ukai
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ukai-gateway
