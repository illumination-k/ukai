# `images` follows the build of images/runtime/Dockerfile that main publishes;
# replace gateway.toml with your agents, typically in an overlay of this
# directory, and pin a commit tag there if you want one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
  - surrealdb.yaml
images:
  - name: ukai-runtime
    newName: ghcr.io/illumination-k/ukai-runtime
    newTag: latest
  # Within the 3.x the gateway's SurrealDB client speaks to.
  - name: surrealdb
    newName: surrealdb/surrealdb
    newTag: v3.3.4
configMapGenerator:
  - name: ukai-gateway
    files:
      - gateway.toml
