# RustFS keeping a copy of every workspace's reports, so they stay readable
# after the agent's pod is gone (the gateway's `UKAI_REPORTS_BUCKET`). It
# speaks S3; any other S3 endpoint works in its place through the gateway's
# `AWS_*` variables. One replica on a volume of its own; only the gateway
# talks to it, and creates the bucket on start.
#
# Its credentials come from the Secret `ukai-rustfs` (keys `access-key` and
# `secret-key`), which this base does not create:
#   kubectl create secret generic ukai-rustfs \
#     --from-literal=access-key=ukai --from-literal=secret-key="$(openssl rand -hex 24)"
#
# Nothing expires on its own: to drop the copies of old workspaces, set a
# lifecycle rule on the bucket.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ukai-rustfs
  labels:
    app.kubernetes.io/name: ukai-rustfs
spec:
  replicas: 1
  serviceName: ukai-rustfs
  selector:
    matchLabels:
      app.kubernetes.io/name: ukai-rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ukai-rustfs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs
          env:
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ukai-rustfs
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ukai-rustfs
                  key: secret-key
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: s3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ukai-rustfs
  labels:
    app.kubernetes.io/name: ukai-rustfs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ukai-rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
