[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/illumination-k/ukai"
rust-version = "1.97"

# External dependency versions are declared once here and referenced from the
# member manifests with `{ workspace = true }`.
[workspace.dependencies]
ukai-acp = { path = "crates/ukai-acp" }
ukai-config = { path = "crates/ukai-config" }
ukai-core = { path = "crates/ukai-core" }
ukai-knowledge = { path = "crates/ukai-knowledge" }
ukai-proto = { path = "crates/ukai-proto" }
ukai-relay = { path = "crates/ukai-relay" }
ukai-voice = { path = "crates/ukai-voice" }

agent-client-protocol = "3.3"
agent-client-protocol-http = "3.3"
# Images for pasting screenshots; dioxus-desktop already brings the `image` crate.
arboard = { version = "3", default-features = false, features = ["image-data"] }
axum = "0.8"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
cpal = "0.18"
dioxus = "0.7.10"
futures = "0.3"
globset = "0.4"
hound = "3.5"
http-body-util = "0.1"
# The checkout's files as git would see them, for `@` mentions.
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "ws"] }
# The relay's PID 1 duties (`ukai-relay`'s `init`): the safe wrappers, since
# the workspace forbids `unsafe`.
nix = { version = "0.31", default-features = false }
# zbus on Linux: no libdbus to link.
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
object_store = { version = "0.14", default-features = false }
percent-encoding = "2"
proptest = "1"
prost = "0.14"
# Compiles the .proto files in Rust, so building needs no `protoc`.
protox = "0.10"
# No `html` or `getopts`: the app renders the parsed tree itself, never HTML.
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false }
# No backend feature: dioxus-desktop already depends on rfd with `xdg-portal`
# on Linux, and rfd refuses to build with both `xdg-portal` and `gtk3`.
rfd = { version = "0.17", default-features = false }
rstest = "0.27"
security-framework = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
# ukai-knowledge's store, reached over WebSocket; engines are opted into
# where needed (`kv-mem` in tests).
surrealdb = { version = "3.3", default-features = false, features = ["protocol-ws", "rustls"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.52", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false }
toml = "1.1"
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router"] }
tonic-health = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
# gRPC-Web, which the gateway answers alongside gRPC and its clients speak
# over the HTTP client they already have.
tonic-web = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
# whisper.cpp, built from source with cmake: transcription stays on the machine.
whisper-rs = "0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"

# Dioxus desktop pulls in a lot of dependencies; optimizing them keeps the dev
# build's webview responsive without slowing incremental rebuilds of our crates.
[profile.dev.package."*"]
opt-level = 1

# On macOS, cargo leaves a test binary's debug info in an object file per
# codegen unit beside it (`unpacked`), and never removes those of a build it
# has replaced, so the target directory grows by tens of gigabytes. Packed,
# each binary has one .dSYM and no objects, and backtraces keep their lines.
[profile.test]
split-debuginfo = "packed"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
