[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/illumination-k/ukai"
rust-version = "1.97"

# External dependency versions are declared once here and referenced from the
# member manifests with `{ workspace = true }`.
[workspace.dependencies]
ukai-acp = { path = "crates/ukai-acp" }
ukai-config = { path = "crates/ukai-config" }
ukai-core = { path = "crates/ukai-core" }
ukai-relay = { path = "crates/ukai-relay" }

agent-client-protocol = "3.3"
agent-client-protocol-http = "3.3"
# Text only: no image support, so no `image` crate.
arboard = { version = "3", default-features = false }
axum = "0.8"
base64 = "0.22"
dioxus = "0.7.10"
futures = "0.3"
globset = "0.4"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "ws"] }
# zbus on Linux: no libdbus to link.
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
percent-encoding = "2"
proptest = "1"
# No `html` or `getopts`: the app renders the parsed tree itself, never HTML.
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13", default-features = false }
# No backend feature: dioxus-desktop already depends on rfd with `xdg-portal`
# on Linux, and rfd refuses to build with both `xdg-portal` and `gtk3`.
rfd = { version = "0.17", default-features = false }
rstest = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.52", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = "0.30"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"

# Dioxus desktop pulls in a lot of dependencies; optimizing them keeps the dev
# build's webview responsive without slowing incremental rebuilds of our crates.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
