[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/illumination-k/ukai"
rust-version = "1.97"

# External dependency versions are declared once here and referenced from the
# member manifests with `{ workspace = true }`.
[workspace.dependencies]
ukai-acp = { path = "crates/ukai-acp" }
ukai-config = { path = "crates/ukai-config" }
ukai-core = { path = "crates/ukai-core" }

agent-client-protocol = "3.3"
agent-client-protocol-http = { version = "3.3", features = ["client"] }
dioxus = "0.7.10"
proptest = "1"
reqwest = { version = "0.13", default-features = false }
# Linux: reuse the GTK that wry already links instead of xdg-portal/wayland.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
rstest = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.52", features = ["macros", "rt", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"

# Dioxus desktop pulls in a lot of dependencies; optimizing them keeps the dev
# build's webview responsive without slowing incremental rebuilds of our crates.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
