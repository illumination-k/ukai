[package]
name = "ukai-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ACP client connections (HTTP, WebSocket, stdio) for ukai"

[dependencies]
agent-client-protocol = { workspace = true, features = ["process"] }
agent-client-protocol-http = { workspace = true, features = ["client"] }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ukai-config = { workspace = true }

# `${keychain:NAME}` references; already in the tree through native-tls.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
ukai-config = { workspace = true }

[lints]
workspace = true
