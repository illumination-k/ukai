[package]
name = "ukai-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Keeps a stdio ACP agent and its sessions alive across client connections"

[dependencies]
agent-client-protocol = { workspace = true, features = ["process"] }
agent-client-protocol-http = { workspace = true, features = ["server"] }
axum = { workspace = true, features = ["ws"] }
clap = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "io-std", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ukai-acp = { workspace = true }
ukai-config = { workspace = true }
ukai-core = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["process", "pthread", "signal"] }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
tower = { workspace = true }

[lints]
workspace = true
