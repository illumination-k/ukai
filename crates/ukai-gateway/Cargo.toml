[package]
name = "ukai-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Serves a namespace's agents over ACP's WebSocket profile, one pod per workspace"

[dependencies]
axum = { workspace = true, features = ["ws"] }
futures = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
percent-encoding = { workspace = true }
# No TLS of its own: the gateway asks for reports from a `ukai-relay` at a
# pod address inside the cluster.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
surrealdb = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ukai-acp = { workspace = true }
ukai-config = { workspace = true }
ukai-core = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
