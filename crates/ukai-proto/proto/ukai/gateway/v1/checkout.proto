// The checkout an agent works in, as the user reaches it: its files, to
// mention one with `@`, running a command in it with `!`, and its changes.
syntax = "proto3";

package ukai.gateway.v1;

import "ukai/gateway/v1/common.proto";

// With the gateway's token. A workspace that is not running is
// FAILED_PRECONDITION: listing never starts a pod.
service Files {
  rpc List(ListFilesRequest) returns (FileListing);
  // The checkout's changes, as `git diff` prints them. ABORTED with what is
  // wrong when there are none to show, as in a checkout that is not a git
  // repository.
  rpc Diff(DiffRequest) returns (CheckoutDiff);
  // The user's reply to an annotation of the agent's review, or resolving
  // or reopening it; answered with the review as it is now. ABORTED with
  // what is wrong when it is refused.
  rpc Annotate(AnnotateRequest) returns (Review);
}

// With the gateway's token, which already lets its holder have the agent
// run commands, and schedule them. A workspace that is not running is
// FAILED_PRECONDITION: running a command never starts a pod.
service Commands {
  rpc Run(RunCommandRequest) returns (CommandOutput);
}

message ListFilesRequest {
  string agent = 1;
  Workspace workspace = 2;
}

message FileListing {
  // The checkout's absolute path in the pod, which `file://` URIs of its
  // files start with.
  string root = 1;
  // Paths relative to `root`, `/`-separated, in order; what the checkout's
  // ignore files exclude is left out.
  repeated string files = 2;
  // There were more files than a listing carries.
  bool truncated = 3;
}

message RunCommandRequest {
  string agent = 1;
  Workspace workspace = 2;
  // A shell command line, run in the checkout.
  string command = 3;
}

message CommandOutput {
  // Absent when the command did not exit by itself, such as on a signal or
  // a timeout.
  optional int32 exit_code = 1;
  // Standard output and error as they came, the end of it when long.
  string output = 2;
  // The start of the output was dropped.
  bool truncated = 3;
  // The command ran too long and was stopped.
  bool timed_out = 4;
}

// What a diff is taken from.
enum DiffBase {
  // Where the branch left the default branch: its commits and what is not
  // committed yet.
  DIFF_BASE_BRANCH = 0;
  // `HEAD`: what is not committed yet.
  DIFF_BASE_UNCOMMITTED = 1;
}

message DiffRequest {
  string agent = 1;
  Workspace workspace = 2;
  DiffBase base = 3;
}

message CheckoutDiff {
  // What the patch is taken from, as the user reads it.
  string base = 1;
  // `git diff` from the base to the working tree, untracked files as added.
  string patch = 2;
  // The patch was cut short, or untracked files were left out.
  bool truncated = 3;
  // What the agent says of these changes, when it has said anything.
  optional Review review = 4;
}

// An agent's review of a checkout's changes: a summary, and annotations on
// lines of the diff.
message Review {
  // Markdown.
  string summary = 1;
  repeated Annotation annotations = 2;
  // When it last changed, in seconds since the epoch.
  int64 updated = 3;
}

enum Priority {
  PRIORITY_NONE = 0;
  PRIORITY_P0 = 1;
  PRIORITY_P1 = 2;
  PRIORITY_P2 = 3;
  PRIORITY_P3 = 4;
}

message Annotation {
  string id = 1;
  // Relative to the checkout's root.
  string path = 2;
  // The line on the new side; absent for the file as a whole.
  optional uint32 line = 3;
  // The last line of a range starting at `line`.
  optional uint32 end_line = 4;
  Priority priority = 5;
  repeated string tags = 6;
  // Markdown.
  string body = 7;
  // The text of the line it is shown at when it was written.
  string anchor = 8;
  bool resolved = 9;
  repeated Reply replies = 10;
}

enum Author {
  AUTHOR_AGENT = 0;
  AUTHOR_USER = 1;
}

message Reply {
  Author by = 1;
  string body = 2;
  int64 at = 3;
}

message AnnotateRequest {
  string agent = 1;
  Workspace workspace = 2;
  string id = 3;
  optional string reply = 4;
  optional bool resolved = 5;
}
