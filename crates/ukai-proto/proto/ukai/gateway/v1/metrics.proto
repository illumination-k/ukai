// What each turn of an agent's sessions took: the gateway takes it from its
// agent pods and answers it to clients, over gRPC and gRPC-Web on its own
// port. See "ターンのメトリクス" in docs/design.md.
syntax = "proto3";

package ukai.gateway.v1;

import "ukai/gateway/v1/common.proto";
import "ukai/metrics/v1/metrics.proto";

// With the gateway's token. Reading never starts a pod: the turns are kept
// by `ukai-store`, whether the workspace runs or not. UNAVAILABLE, a gateway
// that keeps no store, or cannot reach it now.
service Metrics {
  // The workspace's turns, or with `every_workspace` those of every
  // workspace, newest first.
  rpc List(ListTurnsRequest) returns (ukai.metrics.v1.ListResponse);
  // What the workspace's turns, or with `every_workspace` those of every
  // workspace, took, summed up by the store.
  rpc Summarize(SummarizeTurnsRequest) returns (ukai.metrics.v1.SummarizeResponse);
}

message SummarizeTurnsRequest {
  // With `every_workspace`, only this agent's turns; empty for every agent's.
  string agent = 1;
  // Ignored with `every_workspace`.
  Workspace workspace = 2;
  bool every_workspace = 3;
  // Only turns that started at or after this, in milliseconds since the
  // Unix epoch.
  optional uint64 since_ms = 4;
  // How many of the newest turns and slowest tool calls; 0 for the store's
  // default.
  uint32 recent = 5;
}

message ListTurnsRequest {
  // With `every_workspace`, only this agent's turns; empty for every agent's.
  string agent = 1;
  // Ignored with `every_workspace`.
  Workspace workspace = 2;
  // Only this session's turns.
  optional string session = 3;
  // At most this many; 0 for the store's limit.
  uint32 limit = 4;
  // The turns of every workspace the gateway keeps, not just one's.
  bool every_workspace = 5;
}

// Recording a turn of an agent pod's own workspace, with its relay's token:
// the gateway finds the pod by it, and the workspace and agent from the
// pod's Job, never from the request. UNAVAILABLE, a gateway that keeps no
// store, or cannot reach it now.
service WorkspaceMetrics {
  rpc Record(WorkspaceRecordRequest) returns (ukai.metrics.v1.RecordResponse);
}

message WorkspaceRecordRequest {
  ukai.metrics.v1.Turn turn = 1;
}
