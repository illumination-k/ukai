// What the gateway answers a secretary agent's pod about the other
// workspaces, over gRPC and gRPC-Web on its own port. See "秘書" in
// docs/design.md.
syntax = "proto3";

package ukai.gateway.v1;

import "ukai/gateway/v1/common.proto";

// The other workspaces' sessions, for a pod whose agent `gateway.toml`
// marks `secretary = true`, with its relay's token: the gateway finds the
// pod by it and refuses any other pod (PERMISSION_DENIED). A secretary
// never reaches its own workspace, and nothing here answers a permission
// request: the user does that in the session. NOT_FOUND names an agent or
// a session the gateway or the relay does not have; FAILED_PRECONDITION, a
// workspace that is not running or a session whose turn is.
service WorkspaceSecretary {
  // The running workspaces and their sessions.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  // The end of one session's transcript.
  rpc ReadSession(ReadSessionRequest) returns (ReadSessionResponse);
  // Send a prompt to a session whose turn is not running.
  rpc PromptSession(PromptSessionRequest) returns (PromptSessionResponse);
  // Start a session in a workspace, starting its pod if need be, and send
  // it a prompt.
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated RunningWorkspace workspaces = 1;
}

// A workspace with a ready pod.
message RunningWorkspace {
  // The agent's id in `gateway.toml`.
  string agent = 1;
  Workspace workspace = 2;
  repeated SessionSummary sessions = 3;
  // Set when its relay could not be asked for its sessions.
  optional string unreachable = 4;
}

message SessionSummary {
  string id = 1;
  optional string title = 2;
  // A prompt turn is running.
  bool running = 3;
  // How the last turn ended, e.g. `end_turn`.
  optional string stop_reason = 4;
  // The agent asks something (a permission) no one has answered.
  bool waiting = 5;
  // The start of the last prompt and of the agent's last reply.
  optional string last_prompt = 6;
  optional string last_reply = 7;
}

message SessionAddress {
  string agent = 1;
  Workspace workspace = 2;
  string session = 3;
}

message ReadSessionRequest {
  SessionAddress session = 1;
  // How many entries from the end; the relay caps it.
  uint32 limit = 2;
}

message ReadSessionResponse {
  repeated TranscriptEntry entries = 1;
}

message TranscriptEntry {
  TranscriptKind kind = 1;
  string text = 2;
}

enum TranscriptKind {
  TRANSCRIPT_KIND_USER = 0;
  TRANSCRIPT_KIND_AGENT = 1;
  TRANSCRIPT_KIND_TOOL = 2;
}

message PromptSessionRequest {
  SessionAddress session = 1;
  string prompt = 2;
}

message PromptSessionResponse {}

message StartSessionRequest {
  string agent = 1;
  Workspace workspace = 2;
  string prompt = 3;
}

message StartSessionResponse {
  string session = 1;
}
