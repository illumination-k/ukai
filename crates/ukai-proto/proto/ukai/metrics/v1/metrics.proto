// Metrics: what each turn of a gateway agent's sessions took, measured by
// the relay in its pod. See "ターンのメトリクス" in docs/design.md.
syntax = "proto3";

package ukai.metrics.v1;

// The turns `ukai-store` keeps. Only the gateway calls it, with the token it
// shares with it, naming the workspace and agent it found out.
service MetricsStore {
  // Keep one turn.
  rpc Record(RecordRequest) returns (RecordResponse);
  // A workspace's turns, or every workspace's, newest first.
  rpc List(ListRequest) returns (ListResponse);
  // What a workspace's turns, or every workspace's, took, summed up by the
  // store over all of them.
  rpc Summarize(SummarizeRequest) returns (SummarizeResponse);
}

// One turn of a session. Times are in milliseconds, as the relay saw the
// agent's messages arrive.
message Turn {
  // The ACP session; empty if it was not known.
  string session = 1;
  // The gateway's id of the agent. Set by the gateway.
  optional string agent = 2;
  // The model and reasoning effort the agent's settings named at the end.
  optional string model = 3;
  optional string effort = 4;
  // When it started, in milliseconds since the Unix epoch.
  uint64 started_at_ms = 5;
  // The agent's stop reason, or `failed`, `closed`, `superseded`.
  string outcome = 6;
  optional string error = 7;
  uint64 duration_ms = 8;
  // From the start until the agent's first message, thought, or tool call.
  optional uint64 first_output_ms = 9;
  // Streaming the agent's reasoning.
  uint64 thinking_ms = 10;
  // Streaming the agent's reply.
  uint64 message_ms = 11;
  // Waiting for the user to answer permission requests.
  uint64 permission_ms = 12;
  repeated ToolCall tools = 13;
  optional Tokens tokens = 14;
  optional Context context = 15;
  // It was running before it was measured, so it started earlier.
  bool joined = 16;
  // The measure lost the agent for a while during it.
  bool reconnected = 17;
}

message ToolCall {
  // The ACP tool kind, e.g. `execute`, `read`, `edit`.
  string kind = 1;
  string title = 2;
  // `completed`, `failed`, or the status it had when the turn ended.
  string status = 3;
  // Unset if it did not complete or fail during the turn.
  optional uint64 duration_ms = 4;
  // The tool call that started the subagent making this one.
  optional string parent = 5;
}

// The tokens the agent says the turn took.
message Tokens {
  uint64 total = 1;
  uint64 input = 2;
  uint64 output = 3;
  optional uint64 thought = 4;
  optional uint64 cached_read = 5;
  optional uint64 cached_write = 6;
}

// The latest context use and cumulative cost the agent reported.
message Context {
  uint64 used = 1;
  uint64 size = 2;
  optional double cost = 3;
  // ISO 4217, e.g. `USD`.
  optional string currency = 4;
}

message RecordRequest {
  // The gateway's id of the workspace, from the pod's Job.
  string workspace = 1;
  Turn turn = 2;
}

message RecordResponse {
  // Every reason the turn was refused; empty when it was kept.
  repeated string problems = 1;
}

message ListRequest {
  // Empty for every workspace's turns.
  string workspace = 1;
  // Only this session's turns.
  optional string session = 2;
  // At most this many; 0 for the store's limit.
  uint32 limit = 3;
  // Only this agent's turns.
  optional string agent = 4;
}

message ListResponse {
  repeated Turn turns = 1;
}

message SummarizeRequest {
  // Empty for every workspace's turns.
  string workspace = 1;
  // Only this agent's turns.
  optional string agent = 2;
  // Only turns that started at or after this, in milliseconds since the
  // Unix epoch.
  optional uint64 since_ms = 3;
  // How many of the newest turns and of the slowest tool calls to return
  // as they are; 0 for the store's default.
  uint32 recent = 4;
}

// Count, total, mean, median, 90th percentile, and maximum of some
// durations, in milliseconds; all 0 when there are none.
message Spread {
  uint64 count = 1;
  uint64 total = 2;
  uint64 mean = 3;
  uint64 median = 4;
  uint64 p90 = 5;
  uint64 max = 6;
}

// Where the turns' time went, summed, in milliseconds.
message Split {
  // Before the agent's first output.
  uint64 waiting = 1;
  uint64 thinking = 2;
  uint64 message = 3;
  // The agent's own tool calls; a subagent's run inside the call that
  // started it.
  uint64 tools = 4;
  uint64 permission = 5;
  // The rest of the turns' time.
  uint64 other = 6;
}

// The tokens of the turns that say, summed.
message TokenTotals {
  // How many turns said.
  uint64 turns = 1;
  uint64 input = 2;
  uint64 output = 3;
  uint64 thought = 4;
  uint64 cached_read = 5;
  uint64 cached_write = 6;
}

message Outcome {
  string outcome = 1;
  uint64 count = 2;
}

// The latest cumulative cost of each session, summed.
message Cost {
  double amount = 1;
  // ISO 4217; empty when the sessions report more than one currency.
  string currency = 2;
}

message Summary {
  uint64 turns = 1;
  uint64 sessions = 2;
  // Most first.
  repeated Outcome outcomes = 3;
  Spread duration = 4;
  Spread first_output = 5;
  Split split = 6;
  TokenTotals tokens = 7;
  // Unset when no session reports one.
  optional Cost cost = 8;
}

// The turns that share an agent or a model; `unknown` for none.
message Group {
  string name = 1;
  Summary summary = 2;
}

message ToolKind {
  string kind = 1;
  uint64 calls = 2;
  uint64 failed = 3;
  // Of the calls that finished.
  Spread spread = 4;
}

message SlowCall {
  string kind = 1;
  string title = 2;
  uint64 duration_ms = 3;
  string session = 4;
}

message SummarizeResponse {
  Summary summary = 1;
  // Most turns first.
  repeated Group agents = 2;
  repeated Group models = 3;
  // Most time first.
  repeated ToolKind tools = 4;
  // Slowest first.
  repeated SlowCall slowest = 5;
  // Newest first.
  repeated Turn recent = 6;
}
