[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "MIT-0",
  # aws-lc-sys (rustls' default crypto provider, via reqwest).
  "NCSA",
  # webpki-roots (via reqwest's rustls).
  "CDLA-Permissive-2.0",
  # cssparser / selectors / option-ext, via the dioxus desktop stack. File-level
  # copyleft: fine to link as long as those files are not modified.
  "MPL-2.0",
  # clipboard-win / error-code, arboard's Windows backend.
  "BSL-1.0",
  # whisper-rs / whisper-rs-sys (voice input). A public-domain dedication;
  # whisper.cpp itself is MIT.
  "Unlicense",
  # surrealdb and its crates (the gateway's knowledge store client). It only
  # restricts offering SurrealDB itself as a database service.
  "BUSL-1.1",
]
confidence-threshold = 0.8

[bans]
# The desktop stack (dioxus, wry, tao, and their platform bindings) carries
# several duplicate majors that we cannot collapse from here, so duplicates are
# reported rather than fatal.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are not wildcards.
allow-wildcard-paths = true

[advisories]
# Unmaintained-crate notices that only reach us through dioxus-desktop
# 0.7.10. Revisit on every dioxus bump; drop an entry as soon as the path
# that pulls it in is gone.
ignore = [
  { id = "RUSTSEC-2025-0057", reason = "fxhash via wry -> kuchikiki -> selectors" },
  { id = "RUSTSEC-2024-0436", reason = "paste via dioxus-desktop -> image (exr, rav1e)" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros (Linux GTK bindings of tao/muda)" },
  # Unmaintained since merged into zbus 6; notify-rust (4.18.2) still needs zbus 5.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via notify-rust -> zbus 5 (Linux notifications)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via notify-rust -> zbus 5 (Linux notifications)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via notify-rust -> zbus 5 (Linux notifications)" },
  # Only through surrealdb's embedded engine (`kv-mem`), which ukai-gateway's
  # tests alone use; the gateway itself is a client and links none of it.
  # Keep `cargo tree -p ukai-gateway -e normal -i <crate>` empty for each.
  { id = "RUSTSEC-2025-0141", reason = "bincode via surrealmx (surrealdb kv-mem, tests only)" },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via object_store (surrealdb-core, tests only)" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via object_store (surrealdb-core, tests only)" },
  { id = "RUSTSEC-2023-0071", reason = "rsa via jsonwebtoken (surrealdb-core, tests only)" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via jsonwebtoken (surrealdb-core, tests only)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
